; Scenario of the observability example (examples/observability): two saturated UEs share a narrow
; grid under the instrumented proportional-fair metric (metric_type 1000, same as 6) and a report
; of the DSCP counters every 100 TTIs. Run it with: bin/fikore-observability examples/observability/config.ini
[Global]
duration: 3.0
period: 1
multithreading: false
threads: 0
verbose: false
[Scenario]
scenario_type: 0
[UE]
ue_id: controlSmoke
ue_type: 1
n_ues: 2
n_antennas: 1
cqi_period: 5
ri_period: 5
scaling_factor: 1
random_v: false
log_ue: false
log_quality: false
log_traffic: false
log_mobility: false
traffic_type: 0
ul_target: 1.0
dl_target: 200.0
var_perc: 0.0
pkt_size: 12000
mobility_type: 0
pos_x: 300
pos_y: 0
random_init: false
speed: 0.0
max_distance: 400
priority: 1
delta_metric: 1.0
delay_t_metric: 0.1
pkt_delay_budget: 0.300
ue_height: 1.5
ue_location_type: outdoor
building_penetration: none
[eNBConfig]
modulation_m: 1
target_ber: 0.00005
cqi_mode: 1
tx_power: 46
eNB_gain: 8.7
UT_gain: 0
power_boost: 2
frequency: 3500000000.0
bandwidth: 20000000
[PDCP_RLC]
backhaul_d: 0.003
backhaul_d_var: 0.0
order_pkts: true
[MACLayer]
metric_type: 1000
pf_alpha: 1.0
throughput_time_window_ms: 100.0
throughput_intra_tti_update: none
log_mac: false
mimo_layers: 1
n_ofdm_syms: 14
n_re_freq: 12
numerology: 1
max_rtx_ul: 4
max_rtx_dl: 4
harq_model: disabled
mcs_tables: true
scheduling_mode: 1
scheduling_type: 0
scheduling_config: 1
duplexing_type: 0
ratio_DL_UL: 0.5
[PHYLayer]
interference_ues: 2
interference_eNBs: 1
distance_interference: 3500
interfered_bandwidth_ratio: 0.1
thermal_noise: -174
enb_noise_figure: 2
ut_noise_figure: 9
air_delay_var_ul: 0.0
rtx_period_ul: 0.004
rtx_period_var_ul: 0
rtx_proc_delay_ul: 0.002
rtx_proc_delay_var_ul: 0.0
air_delay_var_dl: 0.0
rtx_period_dl: 0.005
rtx_period_var_dl: 0
rtx_proc_delay_dl: 0.002
rtx_proc_delay_var_dl: 0.0

[Observability]
enabled: true
period_tti: 100

[Monitoring]
enabled: true
aggregation_window_ms: 250
emit_ue_phy: false
emit_ue_pdcp: false
emit_ue_queue: false
emit_l4s: false
emit_mac_scheduler: false
emit_emulator_runtime: false
outputs: example_udp
output_example_udp_type: udp
output_example_udp_address: 127.0.0.1
output_example_udp_port: 8097
