; Demo of the runtime control plane: two saturated UEs sharing a narrow grid, so that a
; priority change is immediately visible in the telemetry.
;
;   ./bin/fikore config/control_demo.ini
;   nc -U /tmp/fikore-control.sock
;   {"proto":"fikore-control-1"}
;   {"id":1,"cmds":[{"target":"ue/0","set":{"priority":8.0}}]}
;
; Or through the API: ./run_scripts/run_api.sh and then
;   curl -X POST localhost:8100/control/ue/0 -d '{"priority":8}'
;
; Beware: with metric_type: 5 (round robin) priority does nothing, because the scheduler
; ignores it. This demo uses 6 (proportional fair).
[Global]
duration: 300
period: 1
multithreading: false
threads: 0
verbose: false
progress_log_period_s: 10

[Scenario]
scenario_type: 1

[UE]
ue_id: controlDemo
ue_type: 1
n_ues: 2
n_antennas: 1
alpha_ul: 0.8
nominal_pusch_p0: -60
ul_power_mode: fractional
tx_power_ul: 23
cqi_period: 5
ri_period: 5
scaling_factor: 1
random_v: false
log_freq: 100
log_ue: false
log_quality: false
log_traffic: false
log_mobility: false
traffic_type: 0
ul_target: 5.0
dl_target: 200.0
var_perc: 0.0
pkt_size: 12000
mobility_type: 0
pos_x: 300
pos_y: 0
random_init: false
speed: 0.0
speed_var: 0.0
max_distance: 5000
time_target: 5
time_target_var: 0
priority: 1
delta_metric: 1.0
delay_t_metric: 0.1
pkt_delay_budget: 0.300
l4s_dual_queue: false
ue_height: 1.5
ue_location_type: outdoor
building_penetration: none

[eNBConfig]
modulation_m: 1
target_ber: 0.00005
cqi_mode: 1
tx_power: 46
eNB_gain: 8.7
UT_gain: 0
power_boost: 2
frequency: 3500000000.0
bandwidth: 20000000

[PDCP_RLC]
backhaul_d: 0.003
backhaul_d_var: 0.0
order_pkts: true

[MACLayer]
metric_type: 6
pf_alpha: 1.0
throughput_time_window_ms: 100.0
throughput_intra_tti_update: allocation_unit
log_freq: 10
log_mac: false
mimo_layers: 1
n_ofdm_syms: 14
n_re_freq: 12
numerology: 1
max_rtx_ul: 4
max_rtx_dl: 4
harq_model: legacy_bler
mcs_tables: true
scheduling_mode: 1
scheduling_type: 0
scheduling_config: 1
duplexing_type: 0
ratio_DL_UL: 0.5

[PHYLayer]
interference_ues: 2
interference_eNBs: 1
distance_interference: 3500
interfered_bandwidth_ratio: 0.1
thermal_noise: -174
enb_noise_figure: 2
ut_noise_figure: 9
air_delay_var_ul: 0.0
rtx_period_ul: 0.004
rtx_period_var_ul: 0
rtx_proc_delay_ul: 0.002
rtx_proc_delay_var_ul: 0.0
air_delay_var_dl: 0.0
rtx_period_dl: 0.005
rtx_period_var_dl: 0
rtx_proc_delay_dl: 0.002
rtx_proc_delay_var_dl: 0.0

[Control]
enabled: true
transport: unix
address: /tmp/fikore-control.sock
sync_mode: async
credit_timeout_ms: 30000
on_timeout: continue
timeline_file: none
journal_file: none
max_cmds_per_tick: 256
max_object_events: 65536

[Monitoring]
enabled: true
aggregation_window_ms: 1000
emit_ue_phy: true
emit_ue_pdcp: true
emit_ue_queue: true
emit_ue_mobility: true
emit_mac_scheduler: true
emit_emulator_runtime: true
outputs: api_udp
output_api_udp_type: udp
output_api_udp_address: 127.0.0.1
output_api_udp_port: 8098
