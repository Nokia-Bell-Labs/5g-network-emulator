# Emulated example: one captured UE in rural n78 with simulated online background load.
[Global]
duration: -1
period: 1
multithreading: true
threads: 16
verbose: true

[UE]
ue_id: capturedStudy
ue_type: 0
ul_queue_n: 100
dl_queue_n: 101
n_ues: 1
n_antennas: 1
alpha_ul: 0.8
nominal_pusch_p0: -60
ul_power_mode: fractional
tx_power_ul: 23
cqi_period: 5
ri_period: 5
scaling_factor: 1
random_v: true
log_freq: 100
log_ue: true
log_quality: true
log_traffic: true
log_mobility: true
traffic_type: 0
ul_target: 20.0
dl_target: 20.0
var_perc: 0.10
pkt_size: 12000
mobility_type: 5
pos_x: -400
pos_y: 0
random_init: false
speed: 60.0
speed_var: 10.0
max_distance: 5000
time_target: 5
time_target_var: 0
priority: 4
delta_metric: 1.0
delay_t_metric: 0.1
pkt_delay_budget: 0.300
l4s_dual_queue: false
l4s_target_ms: 15
l4s_rtt_max_ms: 100
l4s_min_th_us: 2000
l4s_range_us: 9000
l4s_k: 2.0
l4s_classic_guard_ms: 1.0
ue_height: 1.5
ue_location_type: vehicle
vehicle_penetration: standard

[UE]
ue_id: onlineBackground
ue_type: 1
n_ues: 10
n_antennas: 1
alpha_ul: 0.8
nominal_pusch_p0: -60
ul_power_mode: fractional
tx_power_ul: 23
cqi_period: 5
ri_period: 5
scaling_factor: 1
random_v: true
log_freq: 100
log_ue: true
log_quality: true
log_traffic: true
log_mobility: true
traffic_type: 0
ul_target: 10.0
dl_target: 10.0
var_perc: 0.10
pkt_size: 12000
mobility_type: 1
pos_x: 0
pos_y: 500
random_init: true
speed: 70.0
speed_var: 15.0
max_distance: 5000
time_target: 5
time_target_var: 0
priority: 1
delta_metric: 1.0
delay_t_metric: 0.1
pkt_delay_budget: 0.300
l4s_dual_queue: false
l4s_target_ms: 15
l4s_rtt_max_ms: 100
l4s_min_th_us: 10000
l4s_range_us: 10000
l4s_k: 2.0
l4s_classic_guard_ms: 1.0
ue_height: 1.5
ue_location_type: vehicle
vehicle_penetration: standard

[Scenario]
scenario_type: 2

[eNBConfig]
modulation_m: 1
target_ber: 0.00005
cqi_mode: 1
tx_power: 46
eNB_gain: 8.7
UT_gain: 0
power_boost: 2
frequency: 3500000000.0
bandwidth: 100000000

[PDCP_RLC]
backhaul_d: 0.003
backhaul_d_var: 0.0
order_pkts: true

[MACLayer]
metric_type: 5
log_freq: 10
log_mac: true
mimo_layers: 1
n_ofdm_syms: 14
n_re_freq: 12
numerology: 1
max_rtx_ul: 4
max_rtx_dl: 4
harq_model: legacy_bler
mcs_tables: true
scheduling_mode: 0
scheduling_type: 1
scheduling_config: 1
duplexing_type: 0
n_dl_slots: 7
n_ul_slots: 3
transition_c: 54
ratio_DL_UL: 0.7

[PHYLayer]
interference_ues: 5
interference_eNBs: 1
distance_interference: 3500
interfered_bandwidth_ratio: 0.1
thermal_noise: -174
enb_noise_figure: 2
ut_noise_figure: 9
air_delay_var_ul: 0.0
rtx_period_ul: 0.004
rtx_period_var_ul: 0
rtx_proc_delay_ul: 0.002
rtx_proc_delay_var_ul: 0.0
air_delay_var_dl: 0.0
rtx_period_dl: 0.005
rtx_period_var_dl: 0
rtx_proc_delay_dl: 0.002
rtx_proc_delay_var_dl: 0.0

[Monitoring]
enabled: true
aggregation_window_ms: 500
default_metric_type: counter
emit_ue_phy: true
emit_ue_pdcp: true
emit_ue_queue: true
emit_ue_mobility: true
emit_l4s: true
emit_mac_scheduler: true
emit_emulator_runtime: true
emit_runtime_debug_logs: false
emit_text_logs_compat: false
outputs: api_udp
output_api_udp_type: udp
output_api_udp_address: 127.0.0.1
output_api_udp_port: 8098

; Runtime control plane, off by default. Turn it on to drive this run from the web
; dashboard or the API (see the Runtime Control wiki page). Give every concurrent run its own
; socket path: the transport unlinks the path on start, so two runs sharing it would
; fight over the same file.
[Control]
enabled: false
transport: unix
address: /tmp/fikore-control.sock
sync_mode: async
